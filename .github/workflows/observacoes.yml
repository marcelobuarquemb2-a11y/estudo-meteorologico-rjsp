name: Collect verified REAL station observations (audit)
'on':
  push:
    branches: [main]
    paths:
      - 'collect_observations.py'
      - '.github/workflows/observacoes.yml'
  schedule:
    - cron: '20 13 * * *'
    - cron: '20 16 * * *'
    - cron: '20 19 * * *'
    - cron: '20 22 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rjsp-real-observations
  cancel-in-progress: false
jobs:
  observations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Acquire REAL observations (no substitutes)
        env:
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: python collect_observations.py
      - name: Preserve audit evidence, including unavailable sources
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/observations/
          if ! git diff --cached --quiet; then
            git commit -m "Archive real station observation acquisition audit"
            git pull --rebase origin main
            git push
          fi
