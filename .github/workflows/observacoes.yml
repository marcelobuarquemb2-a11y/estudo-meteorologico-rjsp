name: Collect verified REAL station observations (audit)
'on':
  push:
    branches: [main]
    paths:
      - 'collect_observations.py'
      - 'compare_forecasts.py'
      - 'backfill_observations.py'
      - '.github/workflows/observacoes.yml'
      - 'collection_schedule.py'
      - 'study_config.py'
      - 'test_observation_retries.py'
  schedule:
    # Main acquisition window: -20, -10, 0, +10, +20, +30 minutes.
    - cron: '40,50 11 * * *'
    - cron: '0,10,20,30 12 * * *'
    - cron: '40,50 14 * * *'
    - cron: '0,10,20,30 15 * * *'
    - cron: '40,50 17 * * *'
    - cron: '0,10,20,30 18 * * *'
    - cron: '40,50 20 * * *'
    - cron: '0,10,20,30 21 * * *'
    # Recover only missing readings when sources publish after the main window.
    - cron: '20 13 * * *'
    - cron: '20 14 * * *'
    - cron: '20 16 * * *'
    - cron: '20 17 * * *'
    - cron: '20 19 * * *'
    - cron: '20 20 * * *'
    - cron: '20 22 * * *'
    - cron: '20 23 * * *'
    - cron: '40 11 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rjsp-real-observations
  cancel-in-progress: false
jobs:
  observations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check observation retry behavior
        run: python -m unittest -q test_observation_retries
      - name: Acquire REAL observations (no substitutes)
        if: github.event.schedule != '40 11 * * *'
        env:
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: python collect_observations.py
      - name: Recover yesterday measured observations after publication delay
        if: github.event.schedule == '40 11 * * *'
        run: python backfill_observations.py
      - name: Join observations with archived forecast vintages
        if: always()
        run: python compare_forecasts.py
      - name: Preserve audit evidence, including unavailable sources
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/observations/ data/comparisons/
          if ! git diff --cached --quiet; then
            git commit -m "Archive real station observation acquisition audit"
            git pull --rebase origin main
            git push
          fi

