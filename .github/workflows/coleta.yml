name: RJ-SP meteorological forecast collection
'on':
  push:
    branches: [main]
    paths:
      - 'collect.py'
      - 'stations.json'
      - 'study_config.py'
      - 'normalize_collection.py'
      - '.github/workflows/coleta.yml'
  schedule:
    - cron: '45 11 * * *'
    - cron: '45 14 * * *'
    - cron: '45 17 * * *'
    - cron: '45 20 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rjsp-meteo
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect
        env:
          METEOBLUE_API_KEY: ${{ secrets.METEOBLUE_API_KEY }}
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: python collect.py
      - name: Commit audit artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Archive RJ-SP forecast audit"
            git pull --rebase origin main
            git push
          fi
