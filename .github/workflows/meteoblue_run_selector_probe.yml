name: Meteoblue historical update selector diagnostic
'on':
  push:
    branches:
      - diagnostic/meteoblue-run-selector-20261117
    paths:
      - '.github/workflows/meteoblue_run_selector_probe.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: meteoblue-run-selector-diagnostic
  cancel-in-progress: false
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Request yesterday update and compare mean wind
        env:
          METEOBLUE_API_KEY: ${{ secrets.METEOBLUE_API_KEY }}
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path
          from zoneinfo import ZoneInfo
          
          TZ = ZoneInfo("America/Sao_Paulo")
          BASELINE = Path("data/2026-11/2026-11-16/152533.json")
          REQUESTED_UTC = "2026-11-16 18:25"
          CONVERSION = 1.9438444924
          
          def brt(value):
              if not value:
                  return None
              try:
                  parsed = dt.datetime.fromisoformat(value)
                  if parsed.tzinfo is None:
                      parsed = parsed.replace(tzinfo=dt.timezone.utc)
                  return parsed.astimezone(TZ).isoformat(timespec="minutes")
              except ValueError:
                  return None
          
          def safe_text(value, secret):
              return str(value).replace(secret, "[REDACTED]")[:600]
          
          def request(station, secret, selector=True):
              params = {"lat":station["lat"], "lon":station["lon"], "asl":0,
                        "tz":"America/Sao_Paulo", "format":"json", "apikey":secret}
              if selector:
                  params["modelrun_updatetime_utc"] = REQUESTED_UTC
              url = "https://my.meteoblue.com/packages/basic-1h?" + urllib.parse.urlencode(params)
              record = {"requested_modelrun_updatetime_brt":brt(REQUESTED_UTC) if selector else None,
                        "selector_sent":selector, "queried_at_brt":dt.datetime.now(TZ).isoformat()}
              try:
                  req = urllib.request.Request(url, headers={"User-Agent":"RJSP-Run-Selector-Diagnostic/1.0"})
                  with urllib.request.urlopen(req, timeout=45) as response:
                      record["http_status"] = response.status
                      payload = json.load(response)
                  record["raw_response"] = payload
                  record["response_error"] = bool(payload.get("error"))
                  metadata = payload.get("metadata", {})
                  record["modelrun_brt"] = brt(metadata.get("modelrun_utc"))
                  record["modelrun_updatetime_brt"] = brt(metadata.get("modelrun_updatetime_utc"))
                  record["requested_update_returned"] = (record["modelrun_updatetime_brt"] == brt(REQUESTED_UTC))
                  if payload.get("error"):
                      record["error_message"] = safe_text(payload.get("error_message", "API error"), secret)
              except urllib.error.HTTPError as exc:
                  record["http_status"] = exc.code
                  try:
                      record["error_message"] = safe_text(exc.read().decode("utf-8", "replace"), secret)
                  except Exception:
                      record["error_message"] = "HTTP error"
              except Exception as exc:
                  record["error_type"] = type(exc).__name__
                  record["error_message"] = safe_text(exc, secret)
              record["finished_at_brt"] = dt.datetime.now(TZ).isoformat()
              return record
          
          def extract(raw, target):
              data = raw.get("data_1h", {})
              normalized = [str(t).replace("T", " ")[:16] for t in data.get("time", [])]
              target = target.replace("T", " ")[:16]
              if target not in normalized:
                  return None
              index = normalized.index(target)
              values = data.get("windspeed", [])
              if index >= len(values) or values[index] is None:
                  return None
              speed = values[index]
              unit = raw.get("units", {}).get("windspeed", "ms-1")
              factor = {"ms-1":CONVERSION, "m/s":CONVERSION, "kmh-1":1/1.852,
                        "km/h":1/1.852, "kn":1, "kt":1, "knots":1}.get(unit)
              return round(speed * factor, 3) if factor is not None else None
          
          baseline = json.loads(BASELINE.read_text())
          report = {"purpose":"user_requested_run_selector_diagnostic_nonofficial",
                    "baseline":str(BASELINE), "requested_update_brt":brt(REQUESTED_UTC),
                    "started_at_brt":dt.datetime.now(TZ).isoformat(),
                    "request_endpoint":"https://my.meteoblue.com/packages/basic-1h",
                    "selector_parameter":"modelrun_updatetime_utc",
                    "selector_documented_in_forecast_openapi":False,
                    "comparison_tolerance_knots":0.002, "stations":[], "controls":[]}
          secret = os.environ.get("METEOBLUE_API_KEY")
          if not secret:
              report["error"] = "METEOBLUE_API_KEY unavailable"
          else:
              for sid, station in baseline["station_results"].items():
                  source = station["sources"]["meteoblue_basic-1h"]
                  original_meta = source["raw"]["metadata"]
                  response = request(station, secret)
                  result = {"station_id":sid, "station":station["name"],
                            "baseline_modelrun_brt":brt(original_meta.get("modelrun_utc")),
                            "baseline_modelrun_updatetime_brt":brt(original_meta.get("modelrun_updatetime_utc")),
                            "baseline_retrieved_at_brt":brt(source.get("retrieved_at")),
                            "request":response, "comparisons":[]}
                  result["baseline_matches_requested_update"] = (
                      result["baseline_modelrun_updatetime_brt"] == brt(REQUESTED_UTC))
                  for row in station.get("forecasts", []):
                      if row.get("source") != "Meteoblue":
                          continue
                      original = row.get("values", {}).get("mean_kt")
                      current = extract(response.get("raw_response", {}), row["target_local"])
                      difference = round(current-original, 3) if current is not None and original is not None else None
                      item = {"target_brt":row["target_local"], "nominal_lead_hours":row["day_offset"]*24,
                              "original_mean_kt":original, "returned_mean_kt":current,
                              "difference_kt":difference,
                              "values_match":abs(difference)<=0.002 if difference is not None else None,
                              "same_requested_update_verified":bool(response.get("requested_update_returned") and result["baseline_matches_requested_update"])}
                      result["comparisons"].append(item)
                  report["stations"].append(result)
                  if sid == "inmet_a619_paraty":
                      control = request(station, secret, selector=False)
                      control["station_id"] = sid
                      control["mean_kt_by_target"] = {
                          row["target_local"]:extract(control.get("raw_response", {}), row["target_local"])
                          for row in station.get("forecasts", []) if row.get("source")=="Meteoblue"}
                      report["controls"].append(control)
          
          comparisons = [r for s in report["stations"] for r in s["comparisons"]]
          report["summary"] = {
              "stations_queried":len(report["stations"]),
              "stations_returning_requested_update":sum(s["request"].get("requested_update_returned",False) for s in report["stations"]),
              "baseline_stations_matching_requested_update":sum(s["baseline_matches_requested_update"] for s in report["stations"]),
              "wind_values_with_both_sides":sum(r["difference_kt"] is not None for r in comparisons),
              "wind_values_matching_within_tolerance":sum(r["values_match"] is True for r in comparisons),
              "wind_values_compared_with_requested_update_verified":sum(r["same_requested_update_verified"] and r["difference_kt"] is not None for r in comparisons)}
          report["finished_at_brt"] = dt.datetime.now(TZ).isoformat()
          out = Path("diagnostic-results/meteoblue_run_selector_20261117.json")
          out.parent.mkdir(exist_ok=True)
          out.write_text(json.dumps(report, ensure_ascii=False, indent=2)+"\n")
          summary = dict(report)
          summary["stations"] = []
          for station in report["stations"]:
              s = dict(station)
              s["request"] = {k:v for k,v in s["request"].items() if k!="raw_response"}
              summary["stations"].append(s)
          summary["controls"] = [{k:v for k,v in control.items() if k!="raw_response"} for control in report["controls"]]
          print("SELECTOR_REPORT_JSON="+json.dumps(summary, ensure_ascii=False), flush=True)
          with open(os.environ.get("GITHUB_STEP_SUMMARY", "/tmp/meteoblue-selector-summary"), "a") as f:
              f.write("# Meteoblue requested-update diagnostic\n\nAll displayed dates are Brasilia time.\n\n")
              f.write("```json\n"+json.dumps(summary, ensure_ascii=False, indent=2)+"\n```\n")
          PY
      - name: Preserve diagnostic responses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meteoblue-run-selector-20261117
          path: diagnostic-results/
          if-no-files-found: error
          retention-days: 30
