name: Validate public observation feeds
'on':
  push:
    branches: ['validation/observacoes-seis-20261107']
    paths: ['.github/workflows/validate-observation-sources.yml', 'validation/*.py']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect public observation feeds
        run: |
          python3 - <<'PY'
          import json
          import re
          import urllib.request
          from pathlib import Path
          from urllib.parse import urlsplit
          
          out = {"run_id": __import__("os").environ["GITHUB_RUN_ID"]}
          
          def read(url):
              req = urllib.request.Request(url, headers={"User-Agent": "RJSP-observations-validation/1.0"})
              with urllib.request.urlopen(req, timeout=25) as resp:
                  return resp.status, resp.headers.get("Content-Type", ""), resp.read().decode("utf-8", errors="replace")
          
          url = "https://sma.portosrio.gov.br/js/index.js?v=1788473201"
          try:
              status, mime, body = read(url)
              paths = set()
              quoted = re.compile(r'''["'\x60]([^"'\x60\\\s]{2,180})["'\x60]''')
              for value in quoted.findall(body):
                  if not value.startswith(("/", "http")) or not re.search(r"api|station|esta[cç]|dados|sensor|medic|param|leitura|relator|sma|hidromar|chart|variavel", value, re.I):
                      continue
                  parsed = urlsplit(value)
                  if parsed.netloc and not (parsed.hostname or "").endswith(("portosrio.gov.br", "hidromares.com.br")):
                      continue
                  if "@" in parsed.netloc or not re.fullmatch(r"[A-Za-z0-9/_{}.:~$%-]+", parsed.path):
                      continue
                  paths.add((f"{parsed.scheme}://{parsed.netloc}" if parsed.netloc else "") + parsed.path)
              method_paths = set()
              for match in re.finditer(r'''\.(get|post)\(\s*["'\x60]([A-Za-z0-9/_.{}:$-]{1,100})''', body):
                  method_paths.add(f"{match.group(1)} {match.group(2)}")
              out["portosrio"] = {"status": status, "mime": mime, "bytes": len(body),
                                  "paths": sorted(paths)[:150], "method_paths": sorted(method_paths)[:150]}
          except Exception as exc:
              out["portosrio"] = {"error": type(exc).__name__, "detail": str(exc)[:240]}
          
          try:
              status, mime, body = read("https://wis2bra.inmet.gov.br/oapi/collections/urn:wmo:md:br-inmet:synop/items?f=json&bbox=-44.80,-23.30,-42.55,-22.83&datetime=2026-11-07T14:55:00Z/2026-11-07T15:05:00Z&limit=500")
              data = json.loads(body)
              out["inmet"] = {"status": status, "mime": mime, "features": len(data.get("features", []))}
          except Exception as exc:
              out["inmet"] = {"error": type(exc).__name__, "detail": str(exc)[:240]}
          
          Path("validation").mkdir(exist_ok=True)
          Path("validation/source-discovery.json").write_text(json.dumps(out, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(out, ensure_ascii=False, indent=2))
          PY
      - name: Save validation evidence to the isolated branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add validation/source-discovery.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record public observation feed diagnostics'
            git push origin HEAD
          fi
