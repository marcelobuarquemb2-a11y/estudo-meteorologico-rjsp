name: Validate six station observations
'on':
  push:
    branches: ['validation/observacoes-seis-20261107']
    paths: ['validation/validate_six.py']
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and validate measurements for the six stations
        run: python3 validation/validate_six.py
      - name: Upload observed records and validation report
        uses: actions/upload-artifact@v4
        with:
          name: observed-records-six-stations
          path: |
            validation/raw/
            validation/report-seis-estacoes.json
          if-no-files-found: error
      - name: Record the validation report on this branch
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add validation/report-seis-estacoes.json
          if ! git diff --cached --quiet; then
            git commit -m 'Archive six-station observation validation'
            git push origin HEAD
          fi
