name: Validate forecast API acquisition
'on':
  workflow_dispatch:
    inputs:
      audit_reason:
        description: 'Reason for manual validation'
        required: false
        default: 'coordinate-time-date-check'
        type: string
permissions:
  contents: write
jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Acquire and archive forecast test
        env:
          METEOBLUE_API_KEY: ${{ secrets.METEOBLUE_API_KEY }}
        run: python smoke_test.py
      - name: Triple-check coordinates, timezone and ISO dates (including Niteroi)
        id: notation_audit
        continue-on-error: true
        env:
          METEOBLUE_API_KEY: ${{ secrets.METEOBLUE_API_KEY }}
        run: python audit_notation.py
      - name: Commit test evidence
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/smoke_tests/
          if ! git diff --cached --quiet; then
            git commit -m "Archive forecast API smoke test"
            git push
          fi
      - name: Enforce notation audit result
        if: steps.notation_audit.outcome == 'failure'
        run: exit 1
